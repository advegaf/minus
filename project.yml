name: Minus
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.17.0"
    CURRENT_PROJECT_VERSION: "16"
    # DEVELOPMENT_TEAM is supplied per-developer via Config/Secrets.xcconfig
    # (see Config/Secrets.example.xcconfig) so no team ID lives in the repo.
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Minus:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Minus
        excludes:
          # Finder resource-fork stubs ("Icon\r") codesign refuses inside bundles.
          - "**/Icon?"
      - path: Support/LaunchScreen.storyboard
        buildPhase: resources
    dependencies:
      - target: MinusMonitor
        embed: true
      - target: MinusReport
        embed: true
      - target: MinusWidget
        embed: true
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        # Supplied per-developer via Config/Secrets.xcconfig (MINUS_BUNDLE_ID), so
        # local Xcode builds always sign with YOUR registered App ID while the
        # repo ships only the neutral example value.
        PRODUCT_BUNDLE_IDENTIFIER: $(MINUS_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Support/Minus.entitlements
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: minus
        # Route the real numbers through, or App Store Connect warns on every
        # upload (literal-default trap — verified in vita build 3).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Dark-only by design (Vivid+Co: obsidian canvas is the theme).
        UIUserInterfaceStyle: Dark
        # Portrait-only, declared in the plist itself: the INFOPLIST_KEY_ build
        # setting is NOT merged when a source Info.plist is used (verified in
        # vita's built product), so it would silently support every orientation.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - GeneralSans-Regular.otf
          - GeneralSans-Bold.otf
          - Satoshi-Regular.otf
          - Satoshi-Bold.otf
          - Switzer-Regular.otf
          - Switzer-Bold.otf
          - CabinetGrotesk-Regular.otf
          - CabinetGrotesk-Bold.otf
          - Chillax-Regular.otf
          - Chillax-Bold.otf
        # The wordmark, centred on obsidian. See Support/LaunchScreen.storyboard
        # for why this is a storyboard and not the UILaunchScreen dictionary.
        UILaunchStoryboardName: LaunchScreen
        # Widget trampoline: minus://open/{slug} and minus://focus.
        CFBundleURLTypes:
          - CFBundleURLName: $(MINUS_BUNDLE_ID)
            CFBundleURLSchemes:
              - minus
        # Runtime source for the app-group id (SharedState reads Bundle.main,
        # never hardcodes), kept in lockstep with the entitlements files.
        MinusAppGroup: group.$(MINUS_BUNDLE_ID)
        # v1.8: minus declares NO query schemes. Opening a URL needs no
        # declaration; only asking whether it would open does, and canOpenURL
        # answered wrong on iOS 27 for installed apps with declared schemes.
        # Nothing probes anymore (DesignGuardTests rule 7 enforces it).

  MinusMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MinusMonitor
        excludes:
          - "**/Icon?"
      # The app<->extension contract, compiled into both targets.
      - path: Minus/Data/SharedState.swift
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINUS_BUNDLE_ID).monitor
        CODE_SIGN_ENTITLEMENTS: Support/MinusMonitor.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Support/MinusMonitor-Info.plist
      properties:
        CFBundleDisplayName: minus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SharedState reads the app-group id from Bundle.main in BOTH targets.
        MinusAppGroup: group.$(MINUS_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension

  MinusReport:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MinusReport
        excludes:
          - "**/Icon?"
      # The report is the one Apple-owned surface in the app; it should still
      # be the app's typeface and colors (same share the widget makes).
      - path: Minus/DesignSystem/Tokens.swift
      - path: Minus/DesignSystem/Typography.swift
      # The typeface contract: the report reads the user's pick from the app
      # group, since an extension cannot reach SwiftData.
      - path: Minus/DesignSystem/Typeface.swift
      # Motion too, so the report's entrance uses the app's own springs. A
      # local curve here would be invisible to DesignGuard, which only scans
      # Minus/ — exactly the fork the motion rules exist to prevent.
      - path: Minus/DesignSystem/Motion.swift
      # Every approved face, as a directory so adding a family needs no
      # project.yml edit. XcodeGen groups it, so the .otf files land at the
      # bundle root where UIAppFonts filenames expect them.
      # Named one by one, never as a directory: copying the folder drags
      # its Finder metadata into the bundle and codesign refuses it.
      - path: Minus/Resources/Fonts/GeneralSans-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/GeneralSans-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Satoshi-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Satoshi-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Switzer-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Switzer-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/CabinetGrotesk-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/CabinetGrotesk-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Chillax-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Chillax-Bold.otf
        buildPhase: resources
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINUS_BUNDLE_ID).report
        CODE_SIGN_ENTITLEMENTS: Support/MinusReport.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Support/MinusReport-Info.plist
      properties:
        CFBundleDisplayName: minus
        # The report renders in the user's chosen typeface, which rides the
        # app group because an extension cannot read SwiftData.
        MinusAppGroup: group.$(MINUS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - GeneralSans-Regular.otf
          - GeneralSans-Bold.otf
          - Satoshi-Regular.otf
          - Satoshi-Bold.otf
          - Switzer-Regular.otf
          - Switzer-Bold.otf
          - CabinetGrotesk-Regular.otf
          - CabinetGrotesk-Bold.otf
          - Chillax-Regular.otf
          - Chillax-Bold.otf
        # The report extension point is spelled deviceactivityUI. The shorter
        # name reads right and builds fine, but the extension never binds and
        # App Store Connect rejects the upload (ITMS-90349).
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension

  MinusWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MinusWidget
        excludes:
          - "**/Icon?"
      # Shared with the app target: the contract + the content views (gallery
      # renders them; DesignGuardTests scans them) + tokens/type. ClockProvider
      # is deliberately NOT here (@MainActor — widgets render from entry.date).
      - path: Minus/Data/LauncherSnapshot.swift
      - path: Minus/Widgets/MinusWidgetViews.swift
      - path: Minus/Widgets/LaunchEssentialIntent.swift
      - path: Minus/Data/PrivateAppLauncher.swift
      - path: Minus/Widgets/LauncherConfigIntent.swift
      - path: Minus/Widgets/CardEntity.swift
      - path: Minus/DesignSystem/Tokens.swift
      - path: Minus/DesignSystem/Typography.swift
      - path: Minus/DesignSystem/Typeface.swift
      # Every approved face, as a directory so adding a family needs no
      # project.yml edit. XcodeGen groups it, so the .otf files land at the
      # bundle root where UIAppFonts filenames expect them.
      # Named one by one, never as a directory: copying the folder drags
      # its Finder metadata into the bundle and codesign refuses it.
      - path: Minus/Resources/Fonts/GeneralSans-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/GeneralSans-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Satoshi-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Satoshi-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Switzer-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Switzer-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/CabinetGrotesk-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/CabinetGrotesk-Bold.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Chillax-Regular.otf
        buildPhase: resources
      - path: Minus/Resources/Fonts/Chillax-Bold.otf
        buildPhase: resources
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINUS_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: Support/MinusWidget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Support/MinusWidget-Info.plist
      properties:
        CFBundleDisplayName: minus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MinusAppGroup: group.$(MINUS_BUNDLE_ID)
        UIAppFonts:
          - GeneralSans-Regular.otf
          - GeneralSans-Bold.otf
          - Satoshi-Regular.otf
          - Satoshi-Bold.otf
          - Switzer-Regular.otf
          - Switzer-Bold.otf
          - CabinetGrotesk-Regular.otf
          - CabinetGrotesk-Bold.otf
          - Chillax-Regular.otf
          - Chillax-Bold.otf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MinusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MinusTests
    dependencies:
      - target: Minus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.minus.tests
        GENERATE_INFOPLIST_FILE: YES

  MinusUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MinusUITests
    dependencies:
      - target: Minus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.minus.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Minus:
    build:
      targets:
        Minus: all
        MinusTests: [test]
        MinusUITests: [test]
    test:
      targets:
        - MinusTests
        - MinusUITests
    run:
      config: Debug
